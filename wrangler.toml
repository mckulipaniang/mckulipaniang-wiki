
# Cloudflare Pages configuration for local preview with Wrangler.
#
# Usage:
#   pnpm build
#   npx wrangler pages dev dist
#
# This file is optional — Cloudflare Pages auto-detects Astro when you
# connect your GitHub repo via the dashboard. Use this only for local
# preview or `wrangler pages deploy`.
#
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "anvilwiki"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
# Site (must include https:// protocol — Astro validates this as a URL)
SITE_URL = "https://mckulipaniang1.wiki"
# Legacy IndexNow override — new forks use .indexnow-key automatically.
#INDEXNOW_KEY = ""
# Giscus comments — blank = disabled until you fill your own values.
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
# Sponsor card — blank = disabled.
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
# Cloudflare Web Analytics — blank = disabled.
PUBLIC_CF_BEACON_TOKEN = ""
# Optional slots (empty = disabled) — fill HERE, not the dashboard:
#PUBLIC_ADSENSE_CLIENT = ""
#PUBLIC_ADSENSE_SLOT_STICKY = ""
#PUBLIC_ADSENSE_SLOT_SIDEBAR = ""
#PUBLIC_ADSENSE_SLOT_INCONTENT = ""
# Adsterra — for each slot you enable, also create public/ads/<name>.html
# with the snippet from the Adsterra dashboard (see docs/ads.md).
#PUBLIC_ADSTERRA_SLOT_SIDEBAR_300X250 = ""
#PUBLIC_ADSTERRA_SLOT_INCONTENT_728X90 = ""
#PUBLIC_ADSTERRA_SLOT_NATIVE_BANNER = ""
#PUBLIC_ADSTERRA_SLOT_STICKY_320X50 = ""
#PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X300 = ""
#PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X600 = ""
#PUBLIC_GA_ID = ""
# VibeCafé product telemetry — set BOTH to enable, empty = off.
#PUBLIC_VIBECAFE_PRODUCT_ID = ""
#PUBLIC_VIBECAFE_AUTH_KEY = ""
#PUBLIC_GSC_VERIFICATION = ""
